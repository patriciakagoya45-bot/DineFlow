<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>DineFlow | Reset password</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <script src="auth.js" defer></script>
    <script src="reset-password.js" defer></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="auth-brand" href="login.html">DineFlow<span>.</span></a>
        <p class="auth-intro">Recover access to your account.</p>

        <div id="resetMessage" role="status" aria-live="polite"></div>
        <div id="resetLinks" hidden></div>

        <form id="requestResetForm">
            <h1>Forgot password?</h1>
            <p class="form-help">Enter your account email to receive a password reset link.</p>

            <label for="resetEmail">Email address</label>
            <input id="resetEmail" type="email" autocomplete="email" required>

            <button type="submit" class="auth-submit">Send reset link</button>
        </form>

        <form id="newPasswordForm" hidden>
            <h1>Choose a new password</h1>

            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>

            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>

            <button type="submit" class="auth-submit">Update password</button>
        </form>

        <a class="auth-return-link" href="login.html">Back to sign in</a>
    </main>
</body>
</html>
