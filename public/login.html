<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DineFlow | Sign in</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <script src="auth.js" defer></script>
    <script src="login.js" defer></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="auth-brand" href="login.html">DineFlow<span>.</span></a>
        <p class="auth-intro">Sign in to your restaurant workspace.</p>

        <div class="auth-tabs" role="tablist">
            <button type="button" class="auth-tab active" id="loginTab">Sign in</button>
            <button type="button" class="auth-tab" id="registerTab">Customer account</button>
        </div>

        <div id="authMessage" role="status" aria-live="polite"></div>
        <form id="loginForm">
            <h1>Welcome back</h1>
            <label for="accountType">Select your role</label>
            <select id="accountType" required>
        <option value="auto">Auto-detect account</option>
    <option value="admin">Administrator</option>
    <option value="manager">Manager</option>
    <option value="chef">Chef</option>
    <option value="waiter">Waiter</option>
    <option value="customer">Customer</option>
            </select>

            <label for="email">Email address</label>
            <input id="email" type="email" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required>

            <button type="submit" class="auth-submit">Sign in</button>
            <a class="auth-secondary-link" href="reset-password.html">Forgot password?</a>
        </form>

        <form id="registerForm" hidden>
            <h1>Create customer account</h1>
            <p class="form-help">Create an account to order dishes and follow order progress.</p>

            <label for="registerName">Full name</label>
            <input id="registerName" type="text" autocomplete="name" required>

            <label for="registerEmail">Email address</label>
            <input id="registerEmail" type="email" autocomplete="email" required>

            <label for="registerPhone">Phone number</label>
            <input id="registerPhone" type="tel" autocomplete="tel" required>

            <label for="registerPassword">Password</label>
            <input id="registerPassword" type="password" minlength="8" autocomplete="new-password" required>
            <small>Use at least 8 characters.</small>

            <button type="submit" class="auth-submit">Create account</button>
        </form>
    </main>
</body>
</html>
